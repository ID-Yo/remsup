foreground = yes
pid =
debug = notice
sslVersionMin = TLSv1.2
cert = /etc/remsup/tls/relay.crt
key = /etc/remsup/tls/relay.key

[relay]
accept = 0.0.0.0:443
connect = 127.0.0.1:8445
protocol = proxy
TIMEOUTidle = 700
TIMEOUTclose = 5

[updates]
accept = 0.0.0.0:8444
connect = 127.0.0.1:8085
TIMEOUTidle = 60
TIMEOUTclose = 5
